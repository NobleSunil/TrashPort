name: Continuous Deployment to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.EC2_HOST || secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || vars.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "🚀 Starting automated deployment on EC2..."

            cd /home/ubuntu/TrashPort

            # Ensure safe git directory
            git config --global --add safe.directory /home/ubuntu/TrashPort

            # Fetch and reset cleanly to origin/main to reconcile any divergent branch state
            git config pull.rebase false
            git fetch origin main
            git reset --hard origin/main

            # Update email SMTP credentials in EC2 production .env
            if [ -f .env ]; then
              if grep -q "^DJANGO_EMAIL_HOST_PASSWORD=" .env; then
                sed -i 's/^DJANGO_EMAIL_HOST_PASSWORD=.*/DJANGO_EMAIL_HOST_PASSWORD=jteustnqureuvptq/' .env
              else
                echo "DJANGO_EMAIL_HOST_PASSWORD=jteustnqureuvptq" >> .env
              fi
              if grep -q "^DJANGO_EMAIL_HOST_USER=" .env; then
                sed -i 's/^DJANGO_EMAIL_HOST_USER=.*/DJANGO_EMAIL_HOST_USER=albertcyriac443@gmail.com/' .env
              else
                echo "DJANGO_EMAIL_HOST_USER=albertcyriac443@gmail.com" >> .env
              fi
              echo "✅ Successfully updated production .env email credentials."
            fi

            # Rebuild and restart Docker containers in background
            docker compose up -d --build
            docker compose restart django

            # Run database migrations and collect static files inside the container
            docker compose exec -T django python manage.py migrate --noinput
            docker compose exec -T django python manage.py collectstatic --noinput

            # Seed cities, hubs, and vehicles
            docker compose exec -T django python manage.py seed_cities_and_hubs || true

            # Clean up dangling unused images to save disk space on EC2
            docker image prune -f

            echo "✅ Deployment completed successfully!"
